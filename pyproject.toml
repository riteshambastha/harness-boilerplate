[project]
name = "harness-boilerplate"
version = "0.1.0"
description = "A small, opinionated harness for building AI applications: it's not just the model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "truststore>=0.9",  # OS certificate store for web_fetch (already pulled in by the SDKs)
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
